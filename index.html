<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My App</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}
body{
  background:#f1f5f9;
}

/* Splash */
#splash{
  position:fixed;
  width:100%;
  height:100vh;
  background:#2563eb;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
#splash h1{
  font-size:32px;
}

/* Login */
#login{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}
.login-box{
  width:90%;
  max-width:350px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.login-box h2{
  text-align:center;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
}

/* Home */
#home{
  display:none;
}
header{
  background:#2563eb;
  color:white;
  padding:18px;
  text-align:center;
  font-size:22px;
}
.container{
  padding:20px;
}
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
}
.logout{
  background:#dc2626;
}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <h1>MY APP</h1>
  <p>กำลังโหลด...</p>
</div>

<!-- Login -->
<div id="login">
  <div class="login-box">
    <h2>เข้าสู่ระบบ</h2>
    <input type="text" id="user" placeholder="ชื่อผู้ใช้">
    <input type="password" id="pass" placeholder="รหัสผ่าน">
    <button onclick="login()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- Home -->
<div id="home">
  <header>หน้า Home</header>
  <div class="container">
    <div class="card">
      <h3>ยินดีต้อนรับ</h3>
      <p>คุณเข้าสู่ระบบสำเร็จ</p>
    </div>

    <div class="card">
      <h3>เมนู</h3>
      <p>- โปรไฟล์</p>
      <p>- ข่าวสาร</p>
      <p>- ตั้งค่า</p>
    </div>

    <button class="logout" onclick="logout()">ออกจากระบบ</button>
  </div>
</div>

<script>
// Splash 2 วินาที
setTimeout(function(){
  document.getElementById("splash").style.display="none";
  document.getElementById("login").style.display="flex";
},2000);

// Login
function login(){
  var u=document.getElementById("user").value;
  var p=document.getElementById("pass").value;

  if(u!=="" && p!==""){
    document.getElementById("login").style.display="none";
    document.getElementById("home").style.display="block";
  }else{
    alert("กรุณากรอกชื่อผู้ใช้และรหัสผ่าน");
  }
}

// Logout
function logout(){
  document.getElementById("home").style.display="none";
  document.getElementById("login").style.display="flex";
}
</script>

</body>
</html>
